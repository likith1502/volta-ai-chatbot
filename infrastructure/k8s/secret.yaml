---
# Secret manifest — values must be base64 encoded in production.
# Use kubectl create secret or ExternalSecrets Operator for real deployments.
apiVersion: v1
kind: Secret
metadata:
  name: volta-secrets
  namespace: volta
type: Opaque
stringData:
  database-url: "postgresql+asyncpg://volta:CHANGE_ME@db-host:5432/volta_prod"
  redis-url: "redis://:CHANGE_ME@redis-host:6379/0"
  gemini-api-key: "REPLACE_WITH_REAL_KEY"
